name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bağımlılıkları yükle
        run: pip install -r requirements-dev.txt

      - name: Playwright Chromium'u kur
        run: python -m playwright install --with-deps chromium

      - name: Birim ve entegrasyon testlerini çalıştır
        run: pytest tests/ --ignore=tests/e2e -v
        env:
          CUREMENU_DB_PATH: /tmp/curemenu_test.db
          GOOGLE_API_KEY: test-dummy-key
          TAVILY_API_KEY: test-dummy-key

      - name: Playwright E2E testlerini çalıştır
        run: pytest tests/e2e -v -ra
        env:
          CUREMENU_DB_PATH: /tmp/curemenu_e2e.db
          GOOGLE_API_KEY: test-dummy-key
          TAVILY_API_KEY: test-dummy-key
          CUREMENU_E2E_REQUIRE_BROWSER: "true"
